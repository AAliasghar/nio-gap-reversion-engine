nio_strategies: # This name must match the 'profile:' name in your dbt_project.yml
  outputs:
    dev:
      type: postgres
      # Connection settings come from env vars; docker-compose.yml sets them for Airflow.
      host: "{{ env_var('NIO_DB_HOST', 'nio_postgres') }}"
      user: "{{ env_var('NIO_DB_USER', 'quant_user') }}"
      password: "{{ env_var('NIO_DB_PASSWORD') }}"
      port: "{{ env_var('NIO_DB_PORT', '5432') | as_number }}"
      dbname: "{{ env_var('NIO_DB_NAME', 'trading_warehouse') }}"
      schema: nio_strategy
      threads: 1
  target: dev
